# Relève mensuelle des frais officiels du Formulaire N-400 (uscis.gov ; UK, Australie et Canada retirés le 2026-10-25).
# Ne tourne qu'une fois le dépôt créé. Un écart (code 2) fait échouer le job : la règle est relue à la main
# (RECETTE §17.4) avant de modifier data/params-2026.json ; official-latest.json garde la trace datée.
name: update-data
on:
  schedule:
    - cron: '17 6 2 * *'   # le 2 de chaque mois, 06:17 UTC
  workflow_dispatch:
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/update-data.py --write
      - name: Commit official-latest.json
        if: always()
        run: |
          git config user.name "Radif Partners"
          git config user.email "amradif@gmail.com"
          git add data/official-latest.json
          git diff --cached --quiet || git commit -m "Relevé des frais officiels $(date -u +%F)"
          git push
